name: Publish NuGet packages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore
        run: dotnet restore backend/Shared/Shared.sln

      - name: Pack packages
        run: |
          mkdir -p ./packages

          find Shared -name "*.csproj" -print0 | while IFS= read -r -d '' project; do
            echo "Packing $project"

            dotnet pack "$project" \
              --configuration Release \
              --no-restore \
              --output ./packages
          done

      - name: Publish packages
        run: |
          for package in ./packages/*.nupkg; do
            echo "Publishing $package"

            dotnet nuget push "$package" \
              --source github \
              --skip-duplicate
          done