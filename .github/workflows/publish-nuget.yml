name: Publish NuGet packages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Restore and pack packages
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIRS=(
            "backend/Shared"
            "backend/FileService"
          )

          mkdir -p ./packages

          for dir in "${PROJECT_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "Directory does not exist: $dir"
              continue
            fi

            while IFS= read -r -d '' project; do
              echo ""
              echo "Checking: $project"

              is_packable=$(
                dotnet msbuild "$project" \
                  -getProperty:IsPackable \
                  -p:Configuration=Release |
                grep -o '"IsPackable":[^,}]*' |
                cut -d: -f2 |
                tr -d '"[:space:]' || true
              )

              if [[ "${is_packable,,}" != "true" ]]; then
                echo "Skipping $project (IsPackable=$is_packable)"
                continue
              fi

              echo "Restoring $project"
              dotnet restore "$project"

              echo "Packing $project"
              dotnet pack "$project" \
                --configuration Release \
                --no-restore \
                --output ./packages

            done < <(
              find "$dir" \
                -type f \
                -name "*.csproj" \
                -not -path "*/bin/*" \
                -not -path "*/obj/*" \
                -print0
            )
          done

      - name: Publish packages
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          packages=(./packages/*.nupkg)

          if [ ${#packages[@]} -eq 0 ]; then
            echo "No NuGet packages found."
            exit 0
          fi

          for package in "${packages[@]}"; do
            echo "Publishing $package"

            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --skip-duplicate
          done