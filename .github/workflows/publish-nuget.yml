name: Publish NuGet packages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Configure GitHub Packages
        run: |
          dotnet nuget add source \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github \
            --username "${{ github.repository_owner }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      - name: Restore and Pack packages
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./packages

          projects=(
            "backend/Shared/Core/Core.csproj"
            "backend/Shared/Framework/Framework.csproj"
            "backend/Shared/SharedKernel/SharedKernel.csproj"
            "backend/FileService/FileService.Contracts/FileService.Contracts.csproj"
          )

          for project in "${projects[@]}"; do
            echo "========================================"
            echo "Preparation: $project"
            echo "========================================"

            if [[ ! -f "$project" ]]; then
              echo "::error::Project file not found: $project"
              exit 1
            fi

            echo "Restore: $project"
            dotnet restore "$project"

            echo "Packing: $project"
            dotnet pack "$project" \
              --configuration Release \
              --output ./packages \
              --no-restore
          done

      - name: Publish packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=(./packages/*.nupkg)

          if (( ${#packages[@]} == 0 )); then
            echo "No packages to publish"
            exit 0
          fi

          for package in "${packages[@]}"; do
            echo "Publishing $package"

            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --skip-duplicate
          done