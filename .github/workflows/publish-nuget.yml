name: Publish NuGet packages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Create MSBuild helper
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/CheckPackable.targets" <<'EOF'
          <Project>
            <Target Name="CheckPackable">
              <Message Text="PACKABLE_VALUE=$(IsPackable)" Importance="High" />
            </Target>
          </Project>
          EOF

      - name: Restore and pack packages
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIRS=(
            "backend/Shared"
            "backend/FileService"
          )

          mkdir -p ./packages

          for dir in "${PROJECT_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "Directory does not exist: $dir"
              continue
            fi

            while IFS= read -r -d '' project; do
              echo ""
              echo "========================================"
              echo "Checking: $project"
              echo "========================================"

              output=$(
                dotnet msbuild "$project" \
                  -p:Configuration=Release \
                  -p:CustomAfterMicrosoftCommonTargets="$RUNNER_TEMP/CheckPackable.targets" \
                  -target:CheckPackable \
                  -nologo
              )

              is_packable=$(
                echo "$output" |
                grep "PACKABLE_VALUE=" |
                tail -n 1 |
                sed 's/.*PACKABLE_VALUE=//' |
                tr -d '\r' |
                xargs
              )

              echo "IsPackable=$is_packable"

              if [[ "${is_packable,,}" != "true" ]]; then
                echo "Skipping $project"
                continue
              fi

              echo "Restoring $project"
              dotnet restore "$project"

              echo "Packing $project"
              dotnet pack "$project" \
                --configuration Release \
                --no-restore \
                --output ./packages

            done < <(
              find "$dir" \
                -type f \
                -name "*.csproj" \
                -not -path "*/bin/*" \
                -not -path "*/obj/*" \
                -print0
            )
          done

      - name: Publish packages
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          packages=(./packages/*.nupkg)

          if [ ${#packages[@]} -eq 0 ]; then
            echo "No NuGet packages found."
            exit 0
          fi

          for package in "${packages[@]}"; do
            echo "Publishing $package"

            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --skip-duplicate
          done