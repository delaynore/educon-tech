name: Publish NuGet packages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  # Список проектов для publish
  PROJECTS: |
    backend/Shared/Core/Core.csproj
    backend/Shared/Framework/Framework.csproj
    backend/Shared/SharedKernel/SharedKernel.csproj
    backend/FileService/FileService.Contracts/FileService.Contracts.csproj

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Configure GitHub Packages
        run: |
          dotnet nuget add source \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github \
            --username "${{ github.repository_owner }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      - name: Restore projects
        run: |
          set -euo pipefail

          while IFS= read -r project; do
            [ -z "$project" ] && continue
            echo "Restoring $project"
            dotnet restore "$project"
          done <<< "$PROJECTS"

      - name: Pack packages
        run: |
          set -euo pipefail
          mkdir -p ./packages

          while IFS= read -r project; do
            [ -z "$project" ] && continue

            if [ ! -f "$project" ]; then
              echo "::error::Project file not found: $project"
              exit 1
            fi

            packable=$(dotnet msbuild "$project" -getProperty:IsPackable --no-restore)

            if [ "$packable" != "true" ]; then
              echo "::error::$project is not IsPackable (IsPackable=$packable), refusing to pack it"
              exit 1
            fi

            echo "Packing $project"
            dotnet pack "$project" \
              --configuration Release \
              --no-restore \
              --output ./packages
          done <<< "$PROJECTS"
        
      - name: Publish packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(./packages/*.nupkg)

          if [ ${#packages[@]} -eq 0 ]; then
            echo "No packages to publish"
            exit 0
          fi

          for package in "${packages[@]}"; do
            echo "Publishing $package"

            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --skip-duplicate
          done