services:
  education-content-service:
    container_name: education-content-service
    build:
      context: ./backend
      dockerfile: EducationContentService/Dockerfile
      args:
        GITHUB_USERNAME: ${GITHUB_USERNAME}
      secrets:
        - github_packages_token
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_HTTP_PORTS=8080
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
      minio:
        condition: service_started
  seq:
    container_name: seq
    image: datalust/seq:latest
    ports: 
      - "8081:80"
      - "5341:5341"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    restart: always
  postgres:
    container_name: postgres-educon
    image: postgres
    environment:
      POSTGRES_DB: educon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  minio:
    container_name: minio
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server --console-address ":9001" /data
    restart: always

secrets:
  github_packages_token:
    environment: GITHUB_PACKAGES_TOKEN